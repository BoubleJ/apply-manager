name: scrape-jobs

on:
  schedule:
    # UTC 21:00 = KST 다음날 06:00 — 3일마다(매월 1·4·7…31일 UTC) 아침 공고 갱신.
    # */3은 월이 바뀌면 카운터가 리셋되므로 31일 → 1일만 1일 간격이 된다 (cron으로는 정확한 72시간 간격을 표현할 수 없다).
    - cron: "0 21 */3 * *"
  workflow_dispatch:

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # llm 전략의 needsBrowser(CSR 페이지) 회사용 — 없으면 해당 회사 스크래핑이 통째로 실패한다 (실측: 플렉스팀)
      - name: Install Playwright chromium
        run: pnpm --filter @job-tracker/scraper exec playwright install --with-deps chromium

      - name: Run job scraper worker
        run: pnpm --filter @job-tracker/worker scrape-jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
          LLM_MODEL_FILTER: ${{ secrets.LLM_MODEL_FILTER || 'openai/gpt-oss-20b' }}
          LLM_MODEL_EXTRACT: ${{ secrets.LLM_MODEL_EXTRACT || 'openai/gpt-oss-120b' }}
